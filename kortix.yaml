# yaml-language-server: $schema=https://kortix.com/schema/kortix.v2.schema.json
# A runnable starter project for a team self-hosting open-source Kortix.
# The grants below are wide on purpose so the starter works on first run.
# Narrow them (connectors, secrets, skills, kortix_permissions) before the
# team depends on this project. Manifest reference:
# https://kortix.com/docs/project/manifest

kortix_version: 2
default_agent: copilot-migration

project:
  name: copilot-migration
  description: A starter project for moving agent work off Microsoft Copilot.

env:
  optional: [ANTHROPIC_API_KEY, OPENAI_API_KEY, OPENROUTER_API_KEY]

agents:
  copilot-migration:
    file: agents/copilot-migration.md
    connectors: all
    secrets: all
    skills: all
    kortix_permissions: all

triggers:
  - slug: copilot-inventory
    type: cron
    agent: copilot-migration
    cron: '0 9 * * 1-5'
    timezone: America/New_York
    prompt: |
      Inventory the agent features the team relies on and mark which Microsoft
      Copilot product each one came from (GitHub Copilot, Copilot Studio, or
      Microsoft 365 Copilot / Copilot Cowork). Write the inventory and the
      replacement plan as a new file under docs/, then open a change request
      with the diff.
